site_name: TI307 & TI307B & TI307P - Introduction au système Linux

repo_url: https://github.com/YvanGuifo/introduction-linux-fr

edit_uri: ""

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js

theme:
  name: material
  language: fr
  favicon: assets/img/favicon.png
  logo: assets/img/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/git-alt
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: fontawesome/solid/bullhorn
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  palette:
    - scheme: default
      primary: light blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: light blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - header.autohide
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - md_in_html
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang:
        - fr
        - en
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          default: false
          name: English
          build: true
          site_name: "TI307 & TI307B & TI307I & TI307P - Introduction to Linux"
          nav_translations:
            Accueil: Home
            Contenus: Contents
            Installation d'une distribution Linux: Installing a Linux distribution
            Lecture préliminaire: Preliminary reading
            Introduction à MarioNum: Introduction to MarioNum
            "Vous n'avez pas de système Linux installé ? Pas grave, Codespace à la rescousse !": "No Linux installed? No worries — Codespace to the rescue!"
            "TP1 - Premières commandes": "Lab 1 - First commands"
            "TP2 — Système de fichiers et permissions": "Lab 2 — File system and permissions"
            "TP3 — Environnement de travail et Compilateur C": "Lab 3 — Working environment and C Compiler"
            "TP4 — Canaux standards et redirections, Processus et tâches, Signaux": "Lab 4 — Standard channels & redirections, Processes & jobs, Signals"
            "Quelques commandes supplémentaires": "Additional commands"
  - tags

nav:
  - Accueil: index.md
  - Contenus:
    - contenus/installation-wsl.md
    - contenus/preliminary-reading.md
    - contenus/Intro-MarioNum.md
    - contenus/codespace.md
    - contenus/tp1.md
    - contenus/tp2.md
    - contenus/tp3.md
    - contenus/tp4.md
    - contenus/tp4-exo.md

extra:
  alternate:
    - name: Français
      link: /introduction-linux-fr/
      lang: fr
    - name: English
      link: /introduction-linux-fr/en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YvanGuifo/introduction-linux-fr
      name: "Dépôt GitHub du cours"
    - icon: fontawesome/solid/paper-plane
      link: mailto:yvan.guifo-fodjo@efrei.fr
      name: "Contacter l'enseignant"

copyright: >
  TI307 & TI307B & TI307I & TI307P - Introduction au système Linux - Efrei Paris 
